# Common nginx configuration for recharge testing system
# This file is included in both HTTP and HTTPS server blocks

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

# Hide nginx version
server_tokens off;

# Client settings
client_max_body_size 20M;
client_body_timeout 60s;
client_header_timeout 60s;

# Connection limits
limit_conn conn_limit 10;

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

# Static files
location /static/ {
    alias /var/www/recharge/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    
    # Security for static files
    location ~* \.(js|css)$ {
        add_header Content-Type-Options "nosniff";
    }
    
    # Prevent access to sensitive files
    location ~* \.(env|log|ini|conf|bak|old|tmp)$ {
        deny all;
    }
}

# Upload files
location /uploads/ {
    alias /var/www/recharge/uploads/;
    expires 30d;
    add_header Cache-Control "public";
    
    # Security for uploads
    location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
        deny all;
    }
}

# API endpoints with rate limiting
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    
    proxy_pass http://recharge_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    
    # Cache control for API responses
    proxy_cache_bypass $http_pragma;
    proxy_cache_revalidate on;
    proxy_cache_min_uses 3;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
}

# File upload endpoint with stricter rate limiting
location /api/upload {
    limit_req zone=upload_limit burst=5 nodelay;
    
    proxy_pass http://recharge_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Extended timeouts for file uploads
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # Disable buffering for uploads
    proxy_request_buffering off;
    proxy_buffering off;
}

# Recharge pages with moderate rate limiting
location /recharge/ {
    limit_req zone=recharge_limit burst=10 nodelay;
    
    proxy_pass http://recharge_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Cache HTML pages briefly
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
}

# Health check endpoint (no rate limiting)
location /health {
    proxy_pass http://recharge_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Quick timeouts for health checks
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    
    # No caching for health checks
    proxy_cache off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# Metrics endpoint (restricted access)
location /metrics {
    # Allow only from monitoring systems
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    
    proxy_pass http://recharge_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Default location for web interface
location / {
    proxy_pass http://recharge_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Cache static content
    location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://recharge_backend;
    }
}

# Security: Block access to sensitive files
location ~* \.(env|log|ini|conf|bak|old|tmp|sql|md)$ {
    deny all;
}

# Security: Block access to hidden files
location ~ /\. {
    deny all;
}

# Custom error pages
error_page 404 /404.html;
error_page 500 502 503 504 /50x.html;

location = /404.html {
    root /var/www/error;
    internal;
}

location = /50x.html {
    root /var/www/error;
    internal;
}