# High availability load balancer configuration for recharge testing system

# Define upstream groups for different services
upstream recharge_api {
    # Use consistent hashing for session affinity
    hash $remote_addr consistent;
    
    # API servers
    server recharge-api-1:8080 max_fails=3 fail_timeout=30s weight=3;
    server recharge-api-2:8080 max_fails=3 fail_timeout=30s weight=3;
    server recharge-api-3:8080 max_fails=3 fail_timeout=30s weight=2;
    
    # Backup server
    server recharge-api-backup:8080 backup;
    
    # Keepalive connections
    keepalive 64;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

upstream recharge_web {
    # Round robin for web requests
    least_conn;
    
    # Web servers
    server recharge-web-1:8080 max_fails=2 fail_timeout=20s;
    server recharge-web-2:8080 max_fails=2 fail_timeout=20s;
    server recharge-web-3:8080 max_fails=2 fail_timeout=20s;
    
    # Keepalive connections
    keepalive 32;
}

# Geo-based routing (if needed)
geo $geo_backend {
    default web;
    # Route specific regions to specific backends
    # 1.2.3.0/24 api;
    # 10.0.0.0/8 web;
}

# Map for backend selection
map $request_uri $backend_pool {
    ~^/api/ recharge_api;
    ~^/metrics recharge_api;
    ~^/health recharge_api;
    default recharge_web;
}

# Rate limiting zones with different limits
limit_req_zone $binary_remote_addr zone=global_limit:20m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api_strict:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=upload_strict:5m rate=1r/s;
limit_req_zone $binary_remote_addr zone=recharge_moderate:10m rate=10r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=global_conn:10m;
limit_conn_zone $server_name zone=server_conn:10m;

# Cache zones
proxy_cache_path /var/cache/nginx/recharge levels=1:2 keys_zone=recharge_cache:100m 
                 max_size=1g inactive=60m use_temp_path=off;

# Main load balancer server
server {
    listen 80;
    listen [::]:80;
    server_name recharge-lb.example.com;
    
    # Global rate limiting
    limit_req zone=global_limit burst=100 nodelay;
    limit_conn global_conn 50;
    limit_conn server_conn 200;
    
    # Security headers
    include /etc/nginx/conf.d/security-headers.conf;
    
    # Logging
    access_log /var/log/nginx/recharge-lb-access.log combined buffer=16k flush=5s;
    error_log /var/log/nginx/recharge-lb-error.log warn;
    
    # Client settings
    client_max_body_size 50M;
    client_body_timeout 120s;
    client_header_timeout 60s;
    client_body_buffer_size 128k;
    
    # Proxy settings
    proxy_cache recharge_cache;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    
    # API endpoints with strict rate limiting
    location /api/ {
        limit_req zone=api_strict burst=50 nodelay;
        
        # Route to API upstream
        proxy_pass http://recharge_api;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Load-Balancer "nginx";
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
        
        # Cache API responses selectively
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 302 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_bypass $http_pragma $http_authorization;
        
        # Add cache status header
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # File upload with very strict rate limiting
    location /api/upload {
        limit_req zone=upload_strict burst=3 nodelay;
        
        proxy_pass http://recharge_api;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeouts for uploads
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Disable buffering for large uploads
        proxy_request_buffering off;
        proxy_buffering off;
        
        # No caching for uploads
        proxy_cache off;
    }
    
    # Recharge pages with moderate rate limiting
    location /recharge/ {
        limit_req zone=recharge_moderate burst=20 nodelay;
        
        proxy_pass http://recharge_web;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache recharge pages
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 2m;
        
        # Add cache headers
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # Health check endpoint (no rate limiting, no caching)
    location /health {
        proxy_pass http://recharge_api;
        
        # Quick health check settings
        proxy_connect_timeout 3s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        
        # No caching
        proxy_cache off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        
        # Health check specific headers
        proxy_set_header Host $host;
        proxy_set_header X-Health-Check "true";
    }
    
    # Metrics endpoint (restricted and no caching)
    location /metrics {
        # Restrict access to monitoring networks
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        
        proxy_pass http://recharge_api;
        proxy_cache off;
        
        # Metrics specific headers
        proxy_set_header Host $host;
        proxy_set_header X-Metrics-Request "true";
    }
    
    # Static files (cached heavily)
    location /static/ {
        proxy_pass http://recharge_web;
        
        # Long cache for static files
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1h;
        
        # Add cache headers
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # Default location
    location / {
        proxy_pass http://recharge_web;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache web pages briefly
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        
        # Add cache status
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # Load balancer status page
    location /lb-status {
        # Restrict access
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        # Return load balancer status
        return 200 "Load Balancer: OK\nUpstream API: $upstream_status\nCache Status: $upstream_cache_status\n";
        add_header Content-Type text/plain;
    }
}

# HTTPS load balancer
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name recharge-lb.example.com;
    
    # SSL configuration
    ssl_certificate /etc/ssl/certs/recharge-lb.example.com.crt;
    ssl_certificate_key /etc/ssl/private/recharge-lb.example.com.key;
    
    # SSL optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:100m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Include the same configuration as HTTP
    include /etc/nginx/conf.d/recharge-lb-common.conf;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name recharge-lb.example.com;
    return 301 https://$server_name$request_uri;
}