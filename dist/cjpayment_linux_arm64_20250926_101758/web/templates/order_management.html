<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 充值测试系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/order_management.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
                        <span>充值测试系统</span>
                    </h6>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="#merchants">
                                <i class="fas fa-store"></i> 商户管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#accounts">
                                <i class="fas fa-credit-card"></i> 账号管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#orders">
                                <i class="fas fa-list-alt"></i> 订单管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#export">
                                <i class="fas fa-download"></i> 数据导出
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">订单管理</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button type="button" class="btn btn-outline-secondary me-2" id="refreshBtn">
                            <i class="fas fa-sync-alt"></i> 刷新
                        </button>
                        <button type="button" class="btn btn-primary" id="exportBtn">
                            <i class="fas fa-download"></i> 导出订单
                        </button>
                    </div>
                </div>

                <!-- 统计卡片 -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card stats-card bg-primary text-white">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <h4 class="card-title" id="totalOrders">0</h4>
                                        <p class="card-text">总订单数</p>
                                    </div>
                                    <div class="align-self-center">
                                        <i class="fas fa-list-alt fa-2x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stats-card bg-success text-white">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <h4 class="card-title" id="completedOrders">0</h4>
                                        <p class="card-text">已完成</p>
                                    </div>
                                    <div class="align-self-center">
                                        <i class="fas fa-check-circle fa-2x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stats-card bg-warning text-white">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <h4 class="card-title" id="pendingOrders">0</h4>
                                        <p class="card-text">待处理</p>
                                    </div>
                                    <div class="align-self-center">
                                        <i class="fas fa-clock fa-2x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stats-card bg-info text-white">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <h4 class="card-title" id="totalAmount">¥0.00</h4>
                                        <p class="card-text">总金额</p>
                                    </div>
                                    <div class="align-self-center">
                                        <i class="fas fa-yen-sign fa-2x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 搜索和筛选 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">搜索和筛选</h5>
                    </div>
                    <div class="card-body">
                        <form id="searchForm">
                            <div class="row">
                                <div class="col-md-3">
                                    <label for="orderNoSearch" class="form-label">订单号</label>
                                    <input type="text" class="form-control" id="orderNoSearch" placeholder="输入订单号">
                                </div>
                                <div class="col-md-3">
                                    <label for="merchantFilter" class="form-label">商户</label>
                                    <select class="form-select" id="merchantFilter">
                                        <option value="">全部商户</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="statusFilter" class="form-label">状态</label>
                                    <select class="form-select" id="statusFilter">
                                        <option value="">全部状态</option>
                                        <option value="pending">待付款</option>
                                        <option value="paid">已付款</option>
                                        <option value="confirmed">已确认</option>
                                        <option value="completed">已完成</option>
                                        <option value="cancelled">已取消</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="paymentTypeFilter" class="form-label">付款类型</label>
                                    <select class="form-select" id="paymentTypeFilter">
                                        <option value="">全部类型</option>
                                        <option value="corporate">对公</option>
                                        <option value="personal">对私</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-md-3">
                                    <label for="dateFrom" class="form-label">开始日期</label>
                                    <input type="date" class="form-control" id="dateFrom">
                                </div>
                                <div class="col-md-3">
                                    <label for="dateTo" class="form-label">结束日期</label>
                                    <input type="date" class="form-control" id="dateTo">
                                </div>
                                <div class="col-md-3">
                                    <label for="amountMin" class="form-label">最小金额</label>
                                    <input type="number" class="form-control" id="amountMin" placeholder="0.00" step="0.01">
                                </div>
                                <div class="col-md-3">
                                    <label for="amountMax" class="form-label">最大金额</label>
                                    <input type="number" class="form-control" id="amountMax" placeholder="0.00" step="0.01">
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-md-12">
                                    <button type="submit" class="btn btn-primary me-2">
                                        <i class="fas fa-search"></i> 搜索
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary" id="resetBtn">
                                        <i class="fas fa-undo"></i> 重置
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 订单列表 -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">订单列表</h5>
                        <div class="d-flex align-items-center">
                            <span class="text-muted me-3" id="orderCount">共 0 条记录</span>
                            <div class="btn-group" role="group">
                                <input type="radio" class="btn-check" name="viewMode" id="tableView" autocomplete="off" checked>
                                <label class="btn btn-outline-secondary btn-sm" for="tableView">
                                    <i class="fas fa-table"></i>
                                </label>
                                <input type="radio" class="btn-check" name="viewMode" id="cardView" autocomplete="off">
                                <label class="btn btn-outline-secondary btn-sm" for="cardView">
                                    <i class="fas fa-th-large"></i>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <!-- 表格视图 -->
                        <div id="tableViewContainer">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover" id="ordersTable">
                                    <thead>
                                        <tr>
                                            <th>
                                                <input type="checkbox" id="selectAllOrders" class="form-check-input">
                                            </th>
                                            <th>订单号</th>
                                            <th>商户</th>
                                            <th>付款人</th>
                                            <th>金额</th>
                                            <th>付款类型</th>
                                            <th>收款账号</th>
                                            <th>状态</th>
                                            <th>创建时间</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="ordersTableBody">
                                        <!-- 数据将通过JavaScript动态加载 -->
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- 卡片视图 -->
                        <div id="cardViewContainer" style="display: none;">
                            <div class="row" id="ordersCardContainer">
                                <!-- 卡片将通过JavaScript动态生成 -->
                            </div>
                        </div>
                        
                        <!-- 分页 -->
                        <nav aria-label="订单列表分页" class="mt-3">
                            <ul class="pagination justify-content-center" id="pagination">
                                <!-- 分页将通过JavaScript动态生成 -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 订单详情模态框 -->
    <div class="modal fade" id="orderDetailModal" tabindex="-1" aria-labelledby="orderDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="orderDetailModalLabel">订单详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <h6>基本信息</h6>
                            <table class="table table-borderless">
                                <tr>
                                    <td><strong>订单号：</strong></td>
                                    <td id="detailOrderNo"></td>
                                </tr>
                                <tr>
                                    <td><strong>商户：</strong></td>
                                    <td id="detailMerchant"></td>
                                </tr>
                                <tr>
                                    <td><strong>付款人：</strong></td>
                                    <td id="detailPayerName"></td>
                                </tr>
                                <tr>
                                    <td><strong>金额：</strong></td>
                                    <td id="detailAmount"></td>
                                </tr>
                                <tr>
                                    <td><strong>广告账户：</strong></td>
                                    <td id="detailAdAccount"></td>
                                </tr>
                                <tr>
                                    <td><strong>付款类型：</strong></td>
                                    <td id="detailPaymentType"></td>
                                </tr>
                                <tr>
                                    <td><strong>状态：</strong></td>
                                    <td id="detailStatus"></td>
                                </tr>
                                <tr>
                                    <td><strong>创建时间：</strong></td>
                                    <td id="detailCreatedAt"></td>
                                </tr>
                                <tr>
                                    <td><strong>更新时间：</strong></td>
                                    <td id="detailUpdatedAt"></td>
                                </tr>
                            </table>
                        </div>
                        <div class="col-md-6">
                            <h6>收款账号信息</h6>
                            <div class="card bg-light">
                                <div class="card-body">
                                    <p><strong>银行：</strong><span id="detailBankName"></span></p>
                                    <p><strong>账号：</strong><span id="detailAccountNumber"></span></p>
                                    <p><strong>户名：</strong><span id="detailAccountName"></span></p>
                                    <p><strong>类型：</strong><span id="detailAccountType"></span></p>
                                </div>
                            </div>
                            
                            <h6 class="mt-3">付款凭证</h6>
                            <div id="paymentProofContainer">
                                <div class="text-muted">暂无付款凭证</div>
                            </div>
                            
                            <h6 class="mt-3">备注信息</h6>
                            <div class="card bg-light">
                                <div class="card-body">
                                    <p id="detailRemark" class="mb-0">无备注</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 操作日志 -->
                    <div class="mt-4">
                        <h6>操作日志</h6>
                        <div class="table-responsive">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>时间</th>
                                        <th>操作</th>
                                        <th>操作人</th>
                                        <th>备注</th>
                                    </tr>
                                </thead>
                                <tbody id="orderLogsTableBody">
                                    <!-- 日志数据将通过JavaScript动态加载 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-success" id="confirmOrderBtn">
                            <i class="fas fa-check"></i> 确认订单
                        </button>
                        <button type="button" class="btn btn-warning" id="rejectOrderBtn">
                            <i class="fas fa-times"></i> 拒绝订单
                        </button>
                        <button type="button" class="btn btn-danger" id="cancelOrderBtn">
                            <i class="fas fa-ban"></i> 取消订单
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 状态更新模态框 -->
    <div class="modal fade" id="statusUpdateModal" tabindex="-1" aria-labelledby="statusUpdateModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="statusUpdateModalLabel">更新订单状态</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="statusUpdateForm">
                    <div class="modal-body">
                        <input type="hidden" id="updateOrderNo" name="order_no">
                        
                        <div class="mb-3">
                            <label class="form-label">订单号</label>
                            <input type="text" class="form-control" id="updateOrderNoDisplay" readonly>
                        </div>
                        
                        <div class="mb-3">
                            <label for="newStatus" class="form-label">新状态 <span class="text-danger">*</span></label>
                            <select class="form-select" id="newStatus" name="status" required>
                                <option value="">请选择状态</option>
                                <option value="paid">已付款</option>
                                <option value="confirmed">已确认</option>
                                <option value="completed">已完成</option>
                                <option value="cancelled">已取消</option>
                            </select>
                            <div class="invalid-feedback">请选择新状态</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="statusRemark" class="form-label">备注</label>
                            <textarea class="form-control" id="statusRemark" name="remark" rows="3" placeholder="请输入状态更新备注"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary" id="statusUpdateSubmitBtn">
                            <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            更新状态
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/order_management.js"></script>
</body>
</html>
