<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收款账号绑定管理 - 充值测试系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/account_binding.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
                        <span>充值测试系统</span>
                    </h6>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="#merchants">
                                <i class="fas fa-store"></i> 商户管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#accounts">
                                <i class="fas fa-credit-card"></i> 账号管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#orders">
                                <i class="fas fa-list-alt"></i> 订单管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#export">
                                <i class="fas fa-download"></i> 数据导出
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">收款账号绑定管理</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bindAccountModal">
                            <i class="fas fa-plus"></i> 绑定账号
                        </button>
                    </div>
                </div>

                <!-- 商户选择 -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="merchantSelect" class="form-label">选择商户</label>
                        <select class="form-select" id="merchantSelect">
                            <option value="">请选择商户</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="accountTypeFilter" class="form-label">账号类型筛选</label>
                        <select class="form-select" id="accountTypeFilter">
                            <option value="">全部类型</option>
                            <option value="corporate">对公账号</option>
                            <option value="personal">对私账号</option>
                        </select>
                    </div>
                </div>

                <!-- 已绑定账号列表 -->
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">已绑定账号</h5>
                        <span class="badge bg-primary" id="boundAccountCount">0</span>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="boundAccountsTable">
                                <thead>
                                    <tr>
                                        <th>优先级</th>
                                        <th>账号类型</th>
                                        <th>银行名称</th>
                                        <th>账号信息</th>
                                        <th>账户名</th>
                                        <th>当日限额</th>
                                        <th>已用金额</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="boundAccountsTableBody">
                                    <!-- 数据将通过JavaScript动态加载 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 可绑定账号列表 -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">可绑定账号</h5>
                        <div class="input-group" style="width: 300px;">
                            <input type="text" class="form-control" id="availableAccountSearch" placeholder="搜索账号...">
                            <button class="btn btn-outline-secondary" type="button" id="searchAvailableBtn">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="availableAccountsTable">
                                <thead>
                                    <tr>
                                        <th>
                                            <input type="checkbox" id="selectAllAvailable" class="form-check-input">
                                        </th>
                                        <th>账号类型</th>
                                        <th>银行名称</th>
                                        <th>账号信息</th>
                                        <th>账户名</th>
                                        <th>当日限额</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="availableAccountsTableBody">
                                    <!-- 数据将通过JavaScript动态加载 -->
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- 批量操作 -->
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div>
                                <button type="button" class="btn btn-success" id="batchBindBtn" disabled>
                                    <i class="fas fa-link"></i> 批量绑定选中账号
                                </button>
                            </div>
                            <div>
                                <span class="text-muted" id="selectedCount">已选择 0 个账号</span>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 绑定账号模态框 -->
    <div class="modal fade" id="bindAccountModal" tabindex="-1" aria-labelledby="bindAccountModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="bindAccountModalLabel">绑定收款账号</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="bindAccountForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="bindMerchantSelect" class="form-label">选择商户 <span class="text-danger">*</span></label>
                            <select class="form-select" id="bindMerchantSelect" name="merchant_id" required>
                                <option value="">请选择商户</option>
                            </select>
                            <div class="invalid-feedback">请选择商户</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="bindAccountSelect" class="form-label">选择收款账号 <span class="text-danger">*</span></label>
                            <select class="form-select" id="bindAccountSelect" name="receive_account_id" required>
                                <option value="">请先选择商户</option>
                            </select>
                            <div class="invalid-feedback">请选择收款账号</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="priority" class="form-label">优先级 <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="priority" name="priority" min="1" max="100" value="1" required>
                            <div class="form-text">数字越小优先级越高，1为最高优先级</div>
                            <div class="invalid-feedback">请输入有效的优先级</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="bindStatus" class="form-label">状态</label>
                            <select class="form-select" id="bindStatus" name="status">
                                <option value="active">启用</option>
                                <option value="inactive">禁用</option>
                            </select>
                        </div>
                        
                        <!-- 账号详情预览 -->
                        <div class="card bg-light" id="accountPreview" style="display: none;">
                            <div class="card-header">
                                <h6 class="card-title mb-0">账号详情预览</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <p><strong>账号类型：</strong><span id="previewAccountType"></span></p>
                                        <p><strong>银行名称：</strong><span id="previewBankName"></span></p>
                                        <p><strong>账户名：</strong><span id="previewAccountName"></span></p>
                                    </div>
                                    <div class="col-md-6">
                                        <p><strong>账号：</strong><span id="previewAccountNumber"></span></p>
                                        <p><strong>当日限额：</strong><span id="previewDailyLimit"></span></p>
                                        <p><strong>状态：</strong><span id="previewStatus"></span></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary" id="bindSubmitBtn">
                            <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            绑定
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 优先级调整模态框 -->
    <div class="modal fade" id="priorityModal" tabindex="-1" aria-labelledby="priorityModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="priorityModalLabel">调整优先级</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="priorityForm">
                    <div class="modal-body">
                        <input type="hidden" id="priorityMerchantId" name="merchant_id">
                        <input type="hidden" id="priorityAccountId" name="account_id">
                        
                        <div class="mb-3">
                            <label class="form-label">账号信息</label>
                            <div class="card bg-light">
                                <div class="card-body">
                                    <p class="mb-1"><strong>银行：</strong><span id="priorityBankName"></span></p>
                                    <p class="mb-0"><strong>账号：</strong><span id="priorityAccountNumber"></span></p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="newPriority" class="form-label">新优先级 <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="newPriority" name="priority" min="1" max="100" required>
                            <div class="form-text">数字越小优先级越高，1为最高优先级</div>
                            <div class="invalid-feedback">请输入有效的优先级</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary" id="prioritySubmitBtn">
                            <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            保存
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/account_binding.js"></script>
</body>
</html>
