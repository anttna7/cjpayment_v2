<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - CJPayment 企业内部支付管理系统</title>
    
    <!-- 统一主题系统 -->
    <link rel="stylesheet" href="/static/css/theme-unified.css">
    
    <!-- 统一按钮样式 -->
    <link rel="stylesheet" href="/static/css/buttons-unified.css">
    
    <!-- 页面特定样式 -->
    <link rel="stylesheet" href="/static/css/auth-enhanced.css">
    <link rel="stylesheet" href="/static/css/forgot-password.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    
    <!-- Meta tags for better SEO -->
    <meta name="description" content="CJPayment企业内部支付管理系统密码找回页面">
    <meta name="keywords" content="密码找回,支付管理,企业内部系统">
    <meta name="author" content="CJPayment Team">
</head>
<body class="auth-page">
    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换明暗主题">
        <span class="theme-icon">🌙</span>
    </button>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <h1>CJPayment</h1>
                    <p>找回您的账户密码</p>
                </div>
            </div>
            
            <!-- Main Form -->
            <div class="auth-body">
                <!-- Step 1: 输入用户信息 -->
                <div id="step1" class="step-container step-container--active">
                    <div class="step-header">
                        <h2>找回密码</h2>
                        <p>请输入您的用户名或邮箱地址，我们将为您发送密码重置链接</p>
                    </div>
                    
                    <form id="forgotPasswordForm" class="auth-form" novalidate>
                        <!-- Account Identifier Field -->
                        <div class="form-group">
                            <label for="accountId" class="form-label">用户名或邮箱</label>
                            <input 
                                type="text" 
                                id="accountId" 
                                name="accountId" 
                                class="form-input" 
                                placeholder="请输入您的用户名或邮箱地址"
                                required
                                aria-describedby="accountIdError"
                            >
                            <div class="form-error" id="accountIdError" role="alert"></div>
                        </div>
                        
                        <!-- Security Question (Optional) -->
                        <div class="form-group" id="securityQuestionGroup" style="display: none;">
                            <label for="securityAnswer" class="form-label">安全问题</label>
                            <div class="security-question-container">
                                <div class="security-question" id="securityQuestionText"></div>
                                <input 
                                    type="text" 
                                    id="securityAnswer" 
                                    name="securityAnswer" 
                                    class="form-input" 
                                    placeholder="请输入安全问题的答案"
                                >
                            </div>
                            <div class="form-error" id="securityAnswerError" role="alert"></div>
                        </div>
                        
                        <!-- Submit Button -->
                        <div class="form-group">
                            <button 
                                type="submit" 
                                class="btn-enhanced btn-primary" 
                                id="sendResetButton"
                            >
                                <span class="btn-text">发送重置链接</span>
                                <span class="btn-loading" style="display: none;">
                                    <span class="spinner" aria-hidden="true"></span>
                                    发送中...
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
                
                <!-- Step 2: 验证码输入 -->
                <div id="step2" class="step-container" style="display: none;">
                    <div class="step-header">
                        <h2>验证身份</h2>
                        <p>我们已向您的邮箱 <strong id="maskedEmail"></strong> 发送了验证码</p>
                        <p class="step-description">请在10分钟内输入6位验证码</p>
                    </div>
                    
                    <form id="verifyCodeForm" class="auth-form" novalidate>
                        <!-- Verification Code -->
                        <div class="form-group">
                            <label for="verificationCode" class="form-label">验证码</label>
                            <div class="verification-input-container">
                                <input 
                                    type="text" 
                                    id="verificationCode" 
                                    name="verificationCode" 
                                    class="form-input verification-input" 
                                    placeholder="输入6位验证码"
                                    maxlength="6"
                                    required
                                >
                                <button 
                                    type="button" 
                                    class="btn-secondary resend-btn" 
                                    id="resendCodeBtn"
                                    disabled
                                >
                                    <span id="resendText">重新发送 (60s)</span>
                                </button>
                            </div>
                            <div class="form-error" id="verificationCodeError" role="alert"></div>
                        </div>
                        
                        <!-- Submit Button -->
                        <div class="form-group">
                            <button 
                                type="submit" 
                                class="btn-enhanced btn-primary" 
                                id="verifyCodeButton"
                            >
                                <span class="btn-text">验证</span>
                                <span class="btn-loading" style="display: none;">
                                    <span class="spinner" aria-hidden="true"></span>
                                    验证中...
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
                
                <!-- Step 3: 设置新密码 -->
                <div id="step3" class="step-container" style="display: none;">
                    <div class="step-header">
                        <h2>设置新密码</h2>
                        <p>请为您的账户设置一个新的安全密码</p>
                    </div>
                    
                    <form id="resetPasswordForm" class="auth-form" novalidate>
                        <!-- New Password -->
                        <div class="form-group">
                            <label for="newPassword" class="form-label">新密码</label>
                            <div class="password-input">
                                <input 
                                    type="password" 
                                    id="newPassword" 
                                    name="newPassword" 
                                    class="form-input" 
                                    placeholder="请输入新密码"
                                    required
                                    aria-describedby="newPasswordError"
                                >
                                <button 
                                    type="button" 
                                    class="password-toggle" 
                                    id="newPasswordToggle"
                                >
                                    <span class="icon">👁️</span>
                                </button>
                            </div>
                            <div class="password-strength" id="passwordStrength">
                                <div class="strength-bar">
                                    <div class="strength-fill" id="strengthFill"></div>
                                </div>
                                <span class="strength-text" id="strengthText">密码强度</span>
                            </div>
                            <div class="form-error" id="newPasswordError" role="alert"></div>
                        </div>
                        
                        <!-- Confirm Password -->
                        <div class="form-group">
                            <label for="confirmPassword" class="form-label">确认新密码</label>
                            <div class="password-input">
                                <input 
                                    type="password" 
                                    id="confirmPassword" 
                                    name="confirmPassword" 
                                    class="form-input" 
                                    placeholder="请再次输入新密码"
                                    required
                                    aria-describedby="confirmPasswordError"
                                >
                                <button 
                                    type="button" 
                                    class="password-toggle" 
                                    id="confirmPasswordToggle"
                                >
                                    <span class="icon">👁️</span>
                                </button>
                            </div>
                            <div class="form-error" id="confirmPasswordError" role="alert"></div>
                        </div>
                        
                        <!-- Submit Button -->
                        <div class="form-group">
                            <button 
                                type="submit" 
                                class="btn-enhanced btn-primary" 
                                id="resetPasswordButton"
                            >
                                <span class="btn-text">重置密码</span>
                                <span class="btn-loading" style="display: none;">
                                    <span class="spinner" aria-hidden="true"></span>
                                    重置中...
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
                
                <!-- Success Message -->
                <div id="successMessage" class="success-container" style="display: none;">
                    <div class="success-icon">✅</div>
                    <h2>密码重置成功！</h2>
                    <p>您的密码已成功重置，现在可以使用新密码登录了</p>
                    <div class="success-actions">
                        <a href="/login" class="btn-enhanced btn-primary">立即登录</a>
                    </div>
                </div>
                
                <!-- Progress Steps -->
                <div class="progress-steps">
                    <div class="progress-step progress-step--active" id="progressStep1">
                        <div class="step-number">1</div>
                        <span class="step-label">输入账户</span>
                    </div>
                    <div class="progress-step" id="progressStep2">
                        <div class="step-number">2</div>
                        <span class="step-label">验证身份</span>
                    </div>
                    <div class="progress-step" id="progressStep3">
                        <div class="step-number">3</div>
                        <span class="step-label">重置密码</span>
                    </div>
                </div>
                
                <!-- Additional Links -->
                <div class="auth-links">
                    <a href="/login" class="auth-link">
                        ← 返回登录
                    </a>
                    <span class="auth-divider">|</span>
                    <a href="/help" class="auth-link">
                        需要帮助？
                    </a>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="auth-footer">
                <p>&copy; 2025 CJPayment. All rights reserved. | Version 2.0</p>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p class="loading-text">正在处理请求...</p>
    </div>

    <!-- Scripts -->
    <script src="/static/js/forgot-password.js"></script>
    
    <!-- Theme Toggle Script -->
    <script>
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = themeToggle.querySelector('.theme-icon');
            const html = document.documentElement;
            
            const savedTheme = localStorage.getItem('auth-theme') || 'light';
            html.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
            
            themeToggle.addEventListener('click', function() {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('auth-theme', newTheme);
                updateThemeIcon(newTheme);
            });
            
            function updateThemeIcon(theme) {
                themeIcon.textContent = theme === 'light' ? '🌙' : '☀️';
                themeToggle.setAttribute('title', 
                    theme === 'light' ? '切换到深色主题' : '切换到浅色主题'
                );
            }
        })();
    </script>

</body>
</html>
