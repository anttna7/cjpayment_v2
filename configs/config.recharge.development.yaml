# Development environment configuration for recharge testing system
server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s
  max_header_bytes: 1048576

database:
  driver: "mysql"
  host: "localhost"
  port: 3306
  username: "cjpayment_dev"
  password: "dev_password_123"
  database: "cjpayment_recharge_dev"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600s
  conn_max_idle_time: 1800s
  log_level: "info"

redis:
  host: "localhost"
  port: 6379
  password: ""
  database: 0
  pool_size: 10
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s
  idle_timeout: 300s
  idle_check_frequency: 60s
  max_retries: 3
  min_retry_backoff: 8ms
  max_retry_backoff: 512ms

jwt:
  secret: "dev_jwt_secret_key_recharge_testing_2024"
  expires_in: 24h
  refresh_expires_in: 168h
  issuer: "recharge-testing-system"

logging:
  level: "debug"
  format: "json"
  output: "stdout"
  file_path: "logs/recharge-dev.log"
  max_size: 100
  max_backups: 5
  max_age: 30
  compress: true

security:
  bcrypt_cost: 10
  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst: 20
  cors:
    allowed_origins: ["http://localhost:3000", "http://localhost:8080"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["*"]
    allow_credentials: true
    max_age: 86400

recharge:
  order_timeout: 1800s # 30 minutes
  max_upload_size: 10485760 # 10MB
  allowed_file_types: ["jpg", "jpeg", "png", "pdf"]
  default_currency: "CNY"
  min_amount: 1.00
  max_amount: 100000.00

notification:
  email:
    smtp_host: "localhost"
    smtp_port: 1025
    username: "dev@recharge.local"
    password: "dev_password"
    from: "dev@recharge.local"
    use_tls: false
  webhook:
    timeout: 30s
    max_retries: 3
    retry_delay: 5s

monitoring:
  enabled: true
  metrics_path: "/metrics"
  health_path: "/health"
  pprof_enabled: true
  pprof_path: "/debug/pprof"

file_storage:
  type: "local"
  local_path: "uploads/dev"
  base_url: "http://localhost:8080/uploads"