# Production environment configuration for recharge testing system
server:
  host: "0.0.0.0"
  port: 8080
  mode: "release"
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  max_header_bytes: 1048576

database:
  driver: "mysql"
  host: "${DB_HOST}"
  port: 3306
  username: "${DB_USERNAME}"
  password: "${DB_PASSWORD}"
  database: "${DB_DATABASE}"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_idle_conns: 20
  max_open_conns: 200
  conn_max_lifetime: 3600s
  conn_max_idle_time: 1800s
  log_level: "error"

redis:
  host: "${REDIS_HOST}"
  port: 6379
  password: "${REDIS_PASSWORD}"
  database: 0
  pool_size: 50
  min_idle_conns: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s
  idle_timeout: 300s
  idle_check_frequency: 60s
  max_retries: 3
  min_retry_backoff: 8ms
  max_retry_backoff: 512ms

jwt:
  secret: "${JWT_SECRET}"
  expires_in: 8h
  refresh_expires_in: 72h
  issuer: "recharge-testing-system"

logging:
  level: "info"
  format: "json"
  output: "file"
  file_path: "/var/log/recharge/app.log"
  max_size: 200
  max_backups: 10
  max_age: 30
  compress: true

security:
  bcrypt_cost: 12
  rate_limit:
    enabled: true
    requests_per_minute: 60
    burst: 10
  cors:
    allowed_origins: ["${ALLOWED_ORIGINS}"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Content-Type", "Authorization", "X-Requested-With"]
    allow_credentials: true
    max_age: 86400

recharge:
  order_timeout: 3600s # 1 hour
  max_upload_size: 20971520 # 20MB
  allowed_file_types: ["jpg", "jpeg", "png", "pdf"]
  default_currency: "CNY"
  min_amount: 1.00
  max_amount: 1000000.00

notification:
  email:
    smtp_host: "${SMTP_HOST}"
    smtp_port: 587
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
    from: "${SMTP_FROM}"
    use_tls: true
  webhook:
    timeout: 30s
    max_retries: 5
    retry_delay: 10s

monitoring:
  enabled: true
  metrics_path: "/metrics"
  health_path: "/health"
  pprof_enabled: false

file_storage:
  type: "${STORAGE_TYPE}"
  local_path: "/var/uploads"
  base_url: "${STORAGE_BASE_URL}"
  # For cloud storage
  access_key: "${STORAGE_ACCESS_KEY}"
  secret_key: "${STORAGE_SECRET_KEY}"
  bucket: "${STORAGE_BUCKET}"
  region: "${STORAGE_REGION}"