<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线模式 - 充值系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .offline-container {
            max-width: 400px;
            width: 100%;
        }
        
        .offline-icon {
            font-size: 80px;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        
        .offline-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .offline-message {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .offline-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .btn {
            padding: 14px 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        
        .btn-primary {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .network-status {
            margin-top: 30px;
            padding: 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }
        
        .status-online {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid rgba(76, 175, 80, 0.5);
        }
        
        .status-offline {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid rgba(244, 67, 54, 0.5);
        }
        
        .cached-data {
            margin-top: 20px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-align: left;
        }
        
        .cached-data h3 {
            font-size: 16px;
            margin-bottom: 12px;
            text-align: center;
        }
        
        .cached-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .cached-item:last-child {
            border-bottom: none;
        }
        
        .cached-label {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .cached-value {
            font-size: 14px;
            font-weight: 500;
        }
        
        @media (max-width: 480px) {
            .offline-icon {
                font-size: 60px;
            }
            
            .offline-title {
                font-size: 24px;
            }
            
            .offline-message {
                font-size: 14px;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .offline-container {
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }
        
        .offline-icon {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📱</div>
        
        <h1 class="offline-title">离线模式</h1>
        
        <p class="offline-message">
            当前网络连接不可用，但您仍可以查看已缓存的内容。
            网络恢复后，您的数据将自动同步。
        </p>
        
        <div class="offline-actions">
            <button class="btn btn-primary" onclick="checkConnection()">
                🔄 检查网络连接
            </button>
            
            <button class="btn" onclick="goHome()">
                🏠 返回首页
            </button>
            
            <button class="btn" onclick="viewCachedData()">
                💾 查看缓存数据
            </button>
        </div>
        
        <div class="network-status" id="networkStatus">
            <span id="statusText">检查网络状态中...</span>
        </div>
        
        <div class="cached-data" id="cachedData" style="display: none;">
            <h3>📦 缓存数据</h3>
            <div class="cached-item">
                <span class="cached-label">表单数据</span>
                <span class="cached-value" id="formDataStatus">检查中...</span>
            </div>
            <div class="cached-item">
                <span class="cached-label">上传文件</span>
                <span class="cached-value" id="fileDataStatus">检查中...</span>
            </div>
            <div class="cached-item">
                <span class="cached-label">缓存大小</span>
                <span class="cached-value" id="cacheSize">计算中...</span>
            </div>
        </div>
    </div>

    <script>
        // 检查网络连接状态
        function updateNetworkStatus() {
            const statusElement = document.getElementById('networkStatus');
            const statusText = document.getElementById('statusText');
            
            if (navigator.onLine) {
                statusElement.className = 'network-status status-online';
                statusText.textContent = '✅ 网络已连接，正在尝试重新加载...';
                
                // 网络恢复后尝试重新加载页面
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
            } else {
                statusElement.className = 'network-status status-offline';
                statusText.textContent = '❌ 网络连接不可用';
            }
        }
        
        // 检查连接
        function checkConnection() {
            updateNetworkStatus();
            
            // 尝试发送网络请求
            fetch('/', { method: 'HEAD', cache: 'no-cache' })
                .then(() => {
                    document.getElementById('statusText').textContent = '✅ 网络连接正常，正在重新加载...';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                })
                .catch(() => {
                    document.getElementById('statusText').textContent = '❌ 网络连接失败，请稍后重试';
                });
        }
        
        // 返回首页
        function goHome() {
            if (navigator.onLine) {
                window.location.href = '/';
            } else {
                alert('网络连接不可用，无法跳转到首页');
            }
        }
        
        // 查看缓存数据
        function viewCachedData() {
            const cachedDataElement = document.getElementById('cachedData');
            
            if (cachedDataElement.style.display === 'none') {
                cachedDataElement.style.display = 'block';
                loadCachedDataInfo();
            } else {
                cachedDataElement.style.display = 'none';
            }
        }
        
        // 加载缓存数据信息
        async function loadCachedDataInfo() {
            try {
                // 检查表单数据
                const formData = localStorage.getItem('recharge_form_data');
                document.getElementById('formDataStatus').textContent = formData ? '✅ 已缓存' : '❌ 无数据';
                
                // 检查文件数据
                const fileData = localStorage.getItem('cached_file_data');
                document.getElementById('fileDataStatus').textContent = fileData ? '✅ 已缓存' : '❌ 无数据';
                
                // 计算缓存大小
                if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({
                        type: 'GET_CACHE_SIZE'
                    });
                } else {
                    document.getElementById('cacheSize').textContent = '无法计算';
                }
            } catch (error) {
                console.error('加载缓存数据信息失败:', error);
            }
        }
        
        // 监听Service Worker消息
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data.type === 'CACHE_SIZE') {
                    const size = event.data.size;
                    const sizeText = formatBytes(size);
                    document.getElementById('cacheSize').textContent = sizeText;
                }
            });
        }
        
        // 格式化字节大小
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // 监听网络状态变化
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        
        // 页面加载时检查网络状态
        document.addEventListener('DOMContentLoaded', () => {
            updateNetworkStatus();
        });
        
        // 键盘快捷键
        document.addEventListener('keydown', (event) => {
            if (event.key === 'r' || event.key === 'R') {
                checkConnection();
            } else if (event.key === 'h' || event.key === 'H') {
                goHome();
            } else if (event.key === 'c' || event.key === 'C') {
                viewCachedData();
            }
        });
        
        // 添加触摸手势支持
        let touchStartY = 0;
        let touchEndY = 0;
        
        document.addEventListener('touchstart', (event) => {
            touchStartY = event.touches[0].clientY;
        });
        
        document.addEventListener('touchend', (event) => {
            touchEndY = event.changedTouches[0].clientY;
            handleSwipe();
        });
        
        function handleSwipe() {
            const swipeDistance = touchStartY - touchEndY;
            const minSwipeDistance = 50;
            
            if (Math.abs(swipeDistance) > minSwipeDistance) {
                if (swipeDistance > 0) {
                    // 向上滑动 - 检查连接
                    checkConnection();
                } else {
                    // 向下滑动 - 查看缓存数据
                    viewCachedData();
                }
            }
        }
    </script>
</body>
</html>
