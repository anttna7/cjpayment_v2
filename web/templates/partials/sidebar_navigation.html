<script>
// 侧边栏交互脚本
(function() {
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const navItems = document.querySelectorAll('.nav-item.has-submenu');

    // 侧边栏折叠/展开
    if (sidebarToggle) {
        sidebarToggle.addEventListener('click', function() {
            sidebar.classList.toggle('collapsed');
            localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
        });
    }

    // 移动端菜单
    if (mobileMenuBtn) {
        mobileMenuBtn.addEventListener('click', function() {
            sidebar.classList.toggle('mobile-open');
        });
    }

    // 恢复侧边栏状态
    if (localStorage.getItem('sidebarCollapsed') === 'true') {
        sidebar.classList.add('collapsed');
    }

    // 子菜单展开/收起
    navItems.forEach(item => {
        const link = item.querySelector('.nav-link');
        link.addEventListener('click', function(e) {
            e.preventDefault();

            // 关闭其他展开的菜单
            navItems.forEach(otherItem => {
                if (otherItem !== item) {
                    otherItem.classList.remove('open');
                }
            });

            // 切换当前菜单
            item.classList.toggle('open');
        });
    });

    // 高亮当前页面
    const currentPath = window.location.pathname;
    document.querySelectorAll('.nav-link, .submenu-link').forEach(link => {
        if (link.getAttribute('href') === currentPath) {
            link.classList.add('active');
            // 如果是子菜单项，展开父菜单
            const parentItem = link.closest('.has-submenu');
            if (parentItem) {
                parentItem.classList.add('open');
            }
        }
    });

    // 更新面包屑
    function updateBreadcrumb() {
        const breadcrumb = document.getElementById('breadcrumb');
        const activeLink = document.querySelector('.nav-link.active, .submenu-link.active');
        if (activeLink && breadcrumb) {
            const text = activeLink.querySelector('.nav-text, .submenu-text');
            if (text) {
                breadcrumb.innerHTML = `<span class="breadcrumb-item">首页</span><span class="breadcrumb-separator">/</span><span class="breadcrumb-item">${text.textContent}</span>`;
            }
        }
    }
    updateBreadcrumb();

    // 退出登录
    window.logout = function() {
        if (confirm('确定要退出登录吗？')) {
            localStorage.removeItem('auth');
            window.location.href = '/login';
        }
    };

    // 点击主内容区域关闭移动端菜单
    document.getElementById('mainContent')?.addEventListener('click', function() {
        if (sidebar.classList.contains('mobile-open')) {
            sidebar.classList.remove('mobile-open');
        }
    });
})();
</script>
