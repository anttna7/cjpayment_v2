<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - CJPayment 企业内部支付管理系统</title>
    
    <!-- 统一主题系统 -->
    <link rel="stylesheet" href="/static/css/theme-unified.css">
    
    <!-- 统一按钮样式 -->
    <link rel="stylesheet" href="/static/css/buttons-unified.css">
    
    <!-- 页面特定样式 -->
    <link rel="stylesheet" href="/static/css/auth-enhanced.css">
    <link rel="stylesheet" href="/static/css/forgot-password.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
</head>
<body class="auth-page">
    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换明暗主题">
        <span class="theme-icon">🌙</span>
    </button>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <h1>CJPayment</h1>
                    <p>重置您的账户密码</p>
                </div>
            </div>
            
            <!-- Main Form -->
            <div class="auth-body">
                <!-- 有效链接 - 设置新密码 -->
                <div id="resetForm" class="step-container step-container--active">
                    <div class="step-header">
                        <h2>设置新密码</h2>
                        <p>请为您的账户 <strong id="accountDisplay"></strong> 设置一个新的安全密码</p>
                    </div>
                    
                    <form id="directResetForm" class="auth-form" novalidate>
                        <!-- New Password -->
                        <div class="form-group">
                            <label for="newPassword" class="form-label">新密码</label>
                            <div class="password-input">
                                <input 
                                    type="password" 
                                    id="newPassword" 
                                    name="newPassword" 
                                    class="form-input" 
                                    placeholder="请输入新密码"
                                    required
                                    aria-describedby="newPasswordError"
                                >
                                <button 
                                    type="button" 
                                    class="password-toggle" 
                                    id="newPasswordToggle"
                                >
                                    <span class="icon">👁️</span>
                                </button>
                            </div>
                            <div class="password-strength" id="passwordStrength">
                                <div class="strength-bar">
                                    <div class="strength-fill" id="strengthFill"></div>
                                </div>
                                <span class="strength-text" id="strengthText">密码强度</span>
                            </div>
                            <div class="form-error" id="newPasswordError" role="alert"></div>
                        </div>
                        
                        <!-- Confirm Password -->
                        <div class="form-group">
                            <label for="confirmPassword" class="form-label">确认新密码</label>
                            <div class="password-input">
                                <input 
                                    type="password" 
                                    id="confirmPassword" 
                                    name="confirmPassword" 
                                    class="form-input" 
                                    placeholder="请再次输入新密码"
                                    required
                                    aria-describedby="confirmPasswordError"
                                >
                                <button 
                                    type="button" 
                                    class="password-toggle" 
                                    id="confirmPasswordToggle"
                                >
                                    <span class="icon">👁️</span>
                                </button>
                            </div>
                            <div class="form-error" id="confirmPasswordError" role="alert"></div>
                        </div>
                        
                        <!-- Submit Button -->
                        <div class="form-group">
                            <button 
                                type="submit" 
                                class="btn-enhanced btn-primary" 
                                id="resetPasswordButton"
                            >
                                <span class="btn-text">重置密码</span>
                                <span class="btn-loading" style="display: none;">
                                    <span class="spinner" aria-hidden="true"></span>
                                    重置中...
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
                
                <!-- 无效链接提示 -->
                <div id="invalidToken" class="error-container" style="display: none;">
                    <div class="error-icon">⚠️</div>
                    <h2>重置链接无效</h2>
                    <p>该密码重置链接已过期或无效。请重新申请密码重置。</p>
                    <div class="error-actions">
                        <a href="/forgot-password" class="btn-enhanced btn-primary">重新找回密码</a>
                        <a href="/login" class="btn-secondary">返回登录</a>
                    </div>
                </div>
                
                <!-- 成功页面 -->
                <div id="successMessage" class="success-container" style="display: none;">
                    <div class="success-icon">✅</div>
                    <h2>密码重置成功！</h2>
                    <p>您的密码已成功重置，现在可以使用新密码登录了</p>
                    <div class="success-actions">
                        <a href="/login" class="btn-enhanced btn-primary">立即登录</a>
                    </div>
                </div>
                
                <!-- Additional Links -->
                <div class="auth-links" id="authLinks">
                    <a href="/login" class="auth-link">
                        ← 返回登录
                    </a>
                    <span class="auth-divider">|</span>
                    <a href="/help" class="auth-link">
                        需要帮助？
                    </a>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="auth-footer">
                <p>&copy; 2025 CJPayment. All rights reserved. | Version 2.0</p>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p class="loading-text">正在处理请求...</p>
    </div>

    <!-- Scripts -->
    <script>
        class ResetPasswordManager {
            constructor() {
                this.resetToken = '';
                this.accountId = '';
                this.init();
            }
            
            init() {
                // 从URL获取token
                const urlParams = new URLSearchParams(window.location.search);
                this.resetToken = urlParams.get('token') || '';
                this.accountId = urlParams.get('account') || '';
                
                if (!this.resetToken) {
                    this.showInvalidToken();
                    return;
                }
                
                // 验证token有效性
                this.validateToken();
                
                this.bindEvents();
                this.initPasswordStrength();
                console.log('🔐 重置密码页面初始化完成');
            }
            
            async validateToken() {
                try {
                    const response = await fetch('/api/validate-reset-token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            resetToken: this.resetToken,
                            accountId: this.accountId
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        document.getElementById('accountDisplay').textContent = result.data.maskedAccount;
                    } else {
                        this.showInvalidToken();
                    }
                } catch (error) {
                    console.error('❌ Token验证失败:', error);
                    this.showInvalidToken();
                }
            }
            
            bindEvents() {
                document.getElementById('directResetForm')?.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleResetPassword();
                });
                
                this.initPasswordToggles();
            }
            
            initPasswordToggles() {
                ['newPasswordToggle', 'confirmPasswordToggle'].forEach(toggleId => {
                    const toggle = document.getElementById(toggleId);
                    if (!toggle) return;
                    
                    toggle.addEventListener('click', () => {
                        const targetId = toggleId.replace('Toggle', '');
                        const input = document.getElementById(targetId);
                        const icon = toggle.querySelector('.icon');
                        
                        if (input.type === 'password') {
                            input.type = 'text';
                            icon.textContent = '🙈';
                        } else {
                            input.type = 'password';
                            icon.textContent = '👁️';
                        }
                    });
                });
            }
            
            initPasswordStrength() {
                const passwordInput = document.getElementById('newPassword');
                if (!passwordInput) return;
                
                passwordInput.addEventListener('input', (e) => {
                    this.updatePasswordStrength(e.target.value);
                    this.validatePasswordMatch();
                });
                
                document.getElementById('confirmPassword')?.addEventListener('input', () => {
                    this.validatePasswordMatch();
                });
            }
            
            updatePasswordStrength(password) {
                const strengthFill = document.getElementById('strengthFill');
                const strengthText = document.getElementById('strengthText');
                
                if (!strengthFill || !strengthText) return;
                
                const strength = this.calculatePasswordStrength(password);
                
                strengthFill.className = 'strength-fill';
                strengthText.className = 'strength-text';
                
                if (password.length === 0) {
                    strengthText.textContent = '密码强度';
                    return;
                }
                
                if (strength.score <= 2) {
                    strengthFill.classList.add('weak');
                    strengthText.classList.add('weak');
                    strengthText.textContent = '弱';
                } else if (strength.score <= 4) {
                    strengthFill.classList.add('medium');
                    strengthText.classList.add('medium');
                    strengthText.textContent = '中等';
                } else {
                    strengthFill.classList.add('strong');
                    strengthText.classList.add('strong');
                    strengthText.textContent = '强';
                }
            }
            
            calculatePasswordStrength(password) {
                let score = 0;
                if (password.length >= 8) score++;
                if (password.length >= 12) score++;
                if (/[a-z]/.test(password)) score++;
                if (/[A-Z]/.test(password)) score++;
                if (/[0-9]/.test(password)) score++;
                if (/[^A-Za-z0-9]/.test(password)) score++;
                return { score, maxScore: 6 };
            }
            
            validatePasswordMatch() {
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const errorElement = document.getElementById('confirmPasswordError');
                
                if (confirmPassword && newPassword !== confirmPassword) {
                    this.showError(errorElement, '两次输入的密码不一致');
                    return false;
                } else {
                    this.clearError(errorElement);
                    return true;
                }
            }
            
            async handleResetPassword() {
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                if (!this.validatePasswordInput(newPassword, confirmPassword)) {
                    return;
                }
                
                this.setLoading('resetPasswordButton', true);
                
                try {
                    const response = await fetch('/api/reset-password-direct', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            resetToken: this.resetToken,
                            accountId: this.accountId,
                            newPassword: newPassword,
                            confirmPassword: confirmPassword
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        this.showSuccessMessage();
                        console.log('✅ 密码重置成功');
                    } else {
                        this.showError(document.getElementById('newPasswordError'), result.message || '重置失败，请稍后重试');
                    }
                } catch (error) {
                    console.error('❌ 密码重置失败:', error);
                    this.showError(document.getElementById('newPasswordError'), '重置失败，请稍后重试');
                } finally {
                    this.setLoading('resetPasswordButton', false);
                }
            }
            
            validatePasswordInput(newPassword, confirmPassword) {
                let valid = true;
                
                if (newPassword.length < 8) {
                    this.showError(document.getElementById('newPasswordError'), '密码至少需要8个字符');
                    valid = false;
                } else if (this.calculatePasswordStrength(newPassword).score < 3) {
                    this.showError(document.getElementById('newPasswordError'), '密码强度太弱，请使用更复杂的密码');
                    valid = false;
                } else {
                    this.clearError(document.getElementById('newPasswordError'));
                }
                
                if (!this.validatePasswordMatch()) {
                    valid = false;
                }
                
                return valid;
            }
            
            showInvalidToken() {
                document.getElementById('resetForm').style.display = 'none';
                document.getElementById('invalidToken').style.display = 'block';
                document.getElementById('authLinks').style.display = 'none';
            }
            
            showSuccessMessage() {
                document.getElementById('resetForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
                document.getElementById('authLinks').style.display = 'none';
            }
            
            setLoading(buttonId, loading) {
                const button = document.getElementById(buttonId);
                if (!button) return;
                
                const textSpan = button.querySelector('.btn-text');
                const loadingSpan = button.querySelector('.btn-loading');
                
                if (loading) {
                    button.disabled = true;
                    button.classList.add('loading');
                    if (textSpan) textSpan.style.display = 'none';
                    if (loadingSpan) loadingSpan.style.display = 'flex';
                } else {
                    button.disabled = false;
                    button.classList.remove('loading');
                    if (textSpan) textSpan.style.display = 'inline';
                    if (loadingSpan) loadingSpan.style.display = 'none';
                }
            }
            
            showError(element, message) {
                if (!element) return;
                element.textContent = message;
                element.style.display = 'block';
                const formGroup = element.closest('.form-group');
                if (formGroup) formGroup.classList.add('form-group--error');
            }
            
            clearError(element) {
                if (!element) return;
                element.textContent = '';
                element.style.display = 'none';
                const formGroup = element.closest('.form-group');
                if (formGroup) formGroup.classList.remove('form-group--error');
            }
        }

        // 主题切换功能
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = themeToggle.querySelector('.theme-icon');
            const html = document.documentElement;
            
            const savedTheme = localStorage.getItem('auth-theme') || 'light';
            html.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
            
            themeToggle.addEventListener('click', function() {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('auth-theme', newTheme);
                updateThemeIcon(newTheme);
            });
            
            function updateThemeIcon(theme) {
                themeIcon.textContent = theme === 'light' ? '🌙' : '☀️';
                themeToggle.setAttribute('title', 
                    theme === 'light' ? '切换到深色主题' : '切换到浅色主题'
                );
            }
        })();

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            new ResetPasswordManager();
        });
    </script>

</body>
</html>
